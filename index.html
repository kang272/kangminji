<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전국 날씨 및 정보 웹사이트</title>

  <!-- 12. link : 외부 CSS/폰트 연결 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    /* 전체 페이지 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
      /* 1. background-color : 전체 배경색 */
      background-color: #f5f5f5;
      /* 6. padding : 전체 바깥 안쪽 여백 */
      padding: 20px;
      color: #333;
    }

    /* 전체 틀 (가로 정렬 & 유동적 너비) */
    .container {
      /* 7. display : flex (좌측 사이드바와 우측 본문배치) */
      display: flex;
      /* 3. width : 유동적 너비 설정 */
      width: 100%;
      max-width: 900px;
      /* 5. margin : 화면 가운데 정렬 */
      margin: 0 auto;
    }

    /* 2. 사이드메뉴 영역 (id 사용) */
    #sidebar {
      /* 3. width & 4. height */
      width: 200px;
      flex-shrink: 0;
      height: 580px;
      /* 1. background-color */
      background-color: #d8d8d8;
      /* 2. border */
      border: 2px solid #a0a0a0;
      /* 6. padding */
      padding: 15px 10px;
      /* 5. margin */
      margin-right: 15px;
    }

    #sidebar h2 {
      font-size: 16px;
      text-align: center;
      /* 5. margin */
      margin-bottom: 15px;
      color: #222;
    }

    .menu-ul {
      list-style: none;
    }

    .menu-ul li {
      /* 5. margin */
      margin-bottom: 10px;
    }

    /* 9. a : 메뉴 링크 */
    .menu-ul a {
      /* 7. display : inline-block */
      display: inline-block;
      /* 3. width & 4. height */
      width: 100%;
      height: 40px;
      line-height: 40px;
      /* 1. background-color */
      background-color: #4a4a4a;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      /* 2. border */
      border: 1px solid #333333;
    }

    .menu-ol-title {
      font-size: 12px;
      font-weight: bold;
      /* 5. margin */
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .menu-ol {
      /* 6. padding */
      padding-left: 20px;
      font-size: 13px;
    }

    .menu-ol li {
      /* 5. margin */
      margin-bottom: 6px;
    }

    /* 우측 전체 컨텐츠 영역 (id 사용) */
    #content-area {
      /* 3. width */
      flex: 1;
      /* 7. display : flex */
      display: flex;
      flex-direction: column;
    }

    /* 1. 메인 / 4. 내 지역 (상단) */
    .top-main-box {
      /* 3. width & 4. height */
      width: 100%;
      height: 90px;
      /* 1. background-color */
      background-color: #d8d8d8;
      /* 2. border */
      border: 2px solid #a0a0a0;
      border-radius: 15px;
      /* 6. padding */
      padding: 12px 20px;
      /* 5. margin */
      margin-bottom: 15px;
    }
