<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>초보자용 날씨 사이트</title>
  
  <!-- 12. link : 외부 스타일 또는 폰트 연결 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    /* 전체 화면 중앙 정렬 */
    body {
      /* 1. background-color : 배경색 */
      background-color: #f0f0f0;
      /* 6. padding : 안쪽 여백 */
      padding: 20px;
    }

    /* 전체 틀 (가로 배치) */
    .container {
      /* 7. display : flex (좌/우 가로 배치) */
      display: flex;
      /* 3. width : 전체 너비 */
      width: 700px;
      /* 5. margin : 가운데 정렬 */
      margin: 0 auto;
    }

    /* 2. 사이드메뉴 (id 사용) */
    #sidebar {
      /* 3. width & 4. height : 너비와 높이 */
      width: 200px;
      height: 400px;
      /* 1. background-color */
      background-color: #e0e0e0;
      /* 2. border : 테두리 */
      border: 2px solid #888888;
      /* 6. padding */
      padding: 10px;
      /* 5. margin : 오른쪽 여백 */
      margin-right: 15px;
    }

    /* 우측 내용 영역 (id 사용) */
    #content {
      /* 3. width */
      width: 485px;
    }

    /* 1. 메인 (상단 영역) */
    .top-box {
      /* 1. background-color */
      background-color: #ffffff;
      /* 2. border */
      border: 2px solid #888888;
      /* 6. padding */
      padding: 10px;
      /* 5. margin : 아래 여백 */
      margin-bottom: 15px;
    }

    /* 3. 본문 영역 */
    .main-box {
      /* 4. height */
      height: 310px;
      /* 1. background-color */
      background-color: #ffffff;
      /* 2. border */
      border: 2px solid #888888;
      /* 6. padding */
      padding: 10px;
    }

    /* 5. inline-block 예시 (강조 글자) */
    .my-location {
      /* 7. display : inline-block */
      display: inline-block;
      /* 1. background-color */
      background-color: #ffff99;
      /* 6. padding */
      padding: 3px;
      /* 2. border */
      border: 1px solid #ccc;
    }

    /* 5. 전국날씨 구성 박스 */
    .weather-box {
      /* 1. background-color */
      background-color: #dddddd;
      /* 2. border */
      border: 1px solid #aaa;
      /* 6. padding */
      padding: 10px;
      /* 5. margin */
      margin-top: 10px;
    }

    /* 날씨 이미지 */
    .weather-img {
      /* 7. display : inline-block */
      display: inline-block;
      /* 3. width & 4. height */
      width: 80px;
      height: 60px;
      /* 2. border */
      border: 1px solid #666;
    }

    /* 날씨 표 (table) */
    .weather-table {
      /* 7. display : inline-block */
      display: inline-block;
      /* 2. border */
      border: 1px solid #666;
      /* 5. margin */
      margin-left: 10px;
    }

    /* 표 칸 테두리 */
    .weather-table th, .weather-table td {
      /* 2. border */
      border: 1px solid #666;
      /* 6. padding */
      padding: 3px 8px;
    }
  </style>
</head>
<body>

  <!-- 전체를 감싸는 div (13. class 사용) -->
  <div class="container">

    <!-- 2. 사이드메뉴 (14. id 사용) -->
    <div id="sidebar">
      <!-- 1. h1~h3 (h2 사용) -->
      <h2>2. 사이드메뉴</h2>

      <!-- 6. ul : 순서없는 목록 -->
      <ul>
        <!-- 8. li & 9. a (링크) -->
        <li><a href="#">메뉴 1</a></li>
        <li><a href="#">메뉴 2</a></li>
      </ul>

      <!-- 7. ol : 순서있는 목록 -->
      <ol>
        <!-- 8. li -->
        <li>항목 A</li>
        <li>항목 B</li>
      </ol>
    </div>

    <!-- 우측 영역 (14. id 사용) -->
    <div id="content">

      <!-- 1. 메인 / 4. 내 지역 -->
      <div class="top-box">
        <!-- 1. h1~h3 (h1 사용) -->
        <h1>1. 메인</h1>
        <!-- 2. p, 3. br, 5. span 사용 -->
        <p>
          내 지역: <span class="my-location">4. 서울</span><br>
          오늘의 날씨 정보입니다.
        </p>
      </div>

      <!-- 3. 본문 영역 -->
      <div class="main-box">
        <!-- 1. h1~h3 (h3 사용) -->
        <h3>3. 본문영역</h3>

        <!-- 5. 전국날씨 구성 -->
        <div class="weather-box">
          <p><b>5. 전국날씨 구성</b></p>
          
          <!-- 10. img (alt 포함) -->
          <img src="https://via.placeholder.com/80x60" alt="날씨 그림" class="weather-img">

          <!-- 11. 표 (table, tr, th, td) -->
          <table class="weather-table">
            <tr>
              <th>지역</th>
              <th>날씨</th>
            </tr>
            <tr>
              <td>서울</td>
              <td>맑음</td>
            </tr>
          </table>
        </div>

        <p style="margin-top: 15px;">본문 설명 내용입니다.</p>
      </div>

    </div>

  </div>

</body>
</html>
