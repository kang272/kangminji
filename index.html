<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 날씨 및 정보 포털</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', '맑은 고딕', sans-serif;
            background-color: #f0f2f5;
            padding: 30px 20px;
            color: #2c3e50;
        }

        /* 전체 레이아웃 (1200px 대형 대시보드 스타일) */
        .container {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 사이드메뉴 */
        #sidebar {
            width: 250px;
            min-height: 600px;
            flex-shrink: 0;
            background-color: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
        }

        #sidebar h2 {
            font-size: 18px;
            text-align: left;
            margin-bottom: 20px;
            padding-left: 5px;
            color: #1a252f;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }

        .menu-ul {
            list-style: none;
        }

        .menu-ul li {
            margin-bottom: 8px;
        }

        .menu-ul a {
            display: block;
            padding: 12px 15px;
            background-color: #f8f9fa;
            color: #333;
            text-decoration: none;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .menu-ul a:hover {
            background-color: #34495e;
            color: #ffffff;
            border-color: #34495e;
        }

        .menu-ol-title {
            font-size: 13px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 12px;
            color: #7f8c8d;
            padding-left: 5px;
        }

        .menu-ol {
            padding-left: 20px;
            font-size: 14px;
            color: #555;
        }

        .menu-ol li {
            margin-bottom: 8px;
        }

        /* 오른쪽 메인 콘텐츠 영역 */
        #content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 상단 지역 헤더 박스 */
        .top-main-box {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
        }

        .top-main-box h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .top-main-box p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }
