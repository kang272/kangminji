<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨누리 - 오산시 날씨정보시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.5;
        }

        /* 1. 최상단 헤더 & GNB */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
        }

        .top-slogan {
            text-align: center;
            font-size: 12px;
            color: #1a5cbe;
            font-weight: bold;
            padding: 6px 0;
            background-color: #f1f5f9;
        }

        .header-main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background-color: #1a5cbe;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 800;
            color: #222;
            letter-spacing: -1px;
        }

        .logo-text span {
            font-size: 11px;
            color: #777;
            display: block;
            margin-top: -3px;
        }

        /* GNB 메인 메뉴 */
        .gnb-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .gnb-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 15px;
            padding: 5px 0;
        }

        .gnb-menu a:hover {
            color: #0078d4;
            border-bottom: 2px solid #0078d4;
        }

        /* 2. 메인 컨테이너 (좌: 지도/검색, 우: 날씨현황) */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 20px;
        }

        /* 메인 왼쪽 영역 */
        .left-panel {
            flex: 1.2;
            min-width: 0;
        }

        /* 탭 버튼 */
        .tab-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            padding: 8px 24px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background-color: #70757a;
            color: white;
            border-radius: 4px 4px 0 0;
        }

        .tab-btn.active {
            background-color: #0078d4;
        }

        /* 검색창 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #0078d4;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 0 20px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 필터 태그버튼 */
        .filter-tags {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag-btn {
            padding: 5px 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 3px;
            cursor: pointer;
            color: #444;
        }

        .tag-btn.active {
            background-color: #0078d4;
            color: white;
            border-color: #0078d4;
        }

        /* 지도/이미지 박스 */
        .map-view-box {
            width: 100%;
            height: 480px;
            background-color: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-view-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 오른쪽 날씨 브리핑 패널 */
        .right-panel {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
