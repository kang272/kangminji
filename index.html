<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전국 날씨 및 정보 웹사이트</title>
  <style>
    /* 기본 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: '맑은 고딕', sans-serif;
      background-color: #f5f5f5;
      padding: 40px 20px;
      color: #333;
    }

    /* 전체 틀 (크게 확대: 1200px) */
    .container {
      display: flex;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 사이드메뉴 */
    #sidebar {
      width: 280px;
      height: 750px;
      flex-shrink: 0;
      background-color: #d8d8d8;
      border: 3px solid #a0a0a0;
      padding: 25px 15px;
      margin-right: 25px;
    }

    #sidebar h2 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 25px;
      color: #111;
    }

    .menu-ul {
      list-style: none;
    }

    .menu-ul li {
      margin-bottom: 15px;
    }

    .menu-ul a {
      display: inline-block;
      width: 100%;
      height: 55px;
      line-height: 55px;
      background-color: #4a4a4a;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      border: 2px solid #333333;
    }

    .menu-ol-title {
      font-size: 15px;
      font-weight: bold;
      margin-top: 35px;
      margin-bottom: 12px;
    }

    .menu-ol {
      padding-left: 25px;
      font-size: 15px;
    }

    .menu-ol li {
      margin-bottom: 10px;
    }

    /* 우측 전체 컨텐츠 영역 */
    #content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 상단 박스 (메인 / 내 지역) */
    .top-main-box {
      width: 100%;
      height: 120px;
      background-color: #d8d8d8;
      border: 3px solid #a0a0a0;
      border-radius: 20px;
      padding: 20px 30px;
      margin-bottom: 25px;
    }

    .top-main-box h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .top-main-box p {
      font-size: 16px;
    }

    .my-region-text {
      display: inline-block;
      font-weight: bold;
      color: #111111;
      background-color: #ffffff;
      border: 2px solid #333333;
      padding: 2px 10px;
    }

    /* 본문 영역 */
    .main-body-box {
      position: relative;
      width: 100%;
      height: 605px;
      background-color: #a8a8a8;
      border: 3px solid #787878;
      padding: 25px;
    }

    /* 전국날씨 프레임 */
    .weather-frame {
      background-color: #606060;
      border: 8px solid #404040;
      padding: 20px;
      margin-bottom: 25px;
      color: #ffffff;
    }

    .weather-frame h3 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .weather-content {
      display: flex;
      align-items: center;
    }

    /* 외부 링크 없이 직접 그리는 고화질 날씨 지도 그래픽 상자 */
    .weather-img-box {
      display: inline-block;
      width: 250px;
      height: 160px;
      background-color: #1b2a47;
      border: 3px solid #ffffff;
      margin-right: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .weather-img-box svg {
      width: 70px;
      height: 70px;
      fill: #ffcc00;
      margin-bottom: 10px;
    }

    .weather-img-box span {
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
    }

    /* 표 (table) */
    .weather-table {
      display: inline-block;
      border-collapse: collapse;
      background-color: #ffffff;
      color: #333;
      font-size: 15px;
      flex: 1;
    }
