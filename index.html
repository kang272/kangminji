<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨누리 - 오산시 날씨정보시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: '맑은 고딕', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.5;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
        }

        .top-slogan {
            text-align: center;
            font-size: 12px;
            color: #1a5cbe;
            font-weight: bold;
            padding: 6px 0;
            background-color: #f1f5f9;
        }

        .header-main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background-color: #1a5cbe;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 800;
            color: #222;
        }

        .logo-text span {
            font-size: 11px;
            color: #777;
            display: block;
        }

        .gnb-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .gnb-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        .gnb-menu a:hover {
            color: #0078d4;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 20px;
        }

        .left-panel {
            flex: 1.2;
            min-width: 0;
        }

        .tab-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            padding: 8px 24px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background-color: #70757a;
            color: white;
            border-radius: 4px 4px 0 0;
        }

        .tab-btn.active {
            background-color: #0078d4;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #0078d4;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 0 20px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-tags {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag-btn {
            padding: 5px 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 3px;
            cursor: pointer;
            color: #444;
        }

        .tag-btn.active {
            background-color: #0078d4;
            color: white;
            border-color: #0078d4;
        }

        /* 💡 이미지 원본 비율 보존 (잘림 방지) */
        .map-view-box {
            width: 100%;
            height: 480px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-view-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 잘리지 않고 원본 비율 전체 표시 */
            background-color: #f8f9fa;
        }

        .right-panel {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .location-header h3 {
            font-size: 16px;
            color: #333;
        }

        .update-time {
            font-size: 12px;
            color: #888;
        }

        .current-temp-area {
            text-align: center;
            padding: 15px 0 5px;
        }

        .main-degree {
            font-size: 52px;
            font-weight: 800;
            color: #111;
        }

        .sensory-temp {
            font-size: 14px;
            color: #555;
        }

        .temp-diff {
            font-size: 14px;
            color: #333;
            margin-top: 5px;
            font-weight: 600;
        }

        .weather-sub-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 12px 5px;
            text-align: center;
            margin: 10px 0;
        }

        .sub-item {
            border-right: 1px solid #eee;
        }

        .sub-item:last-child {
            border-right: none;
        }

        .sub-label {
            font-size: 12px;
            color: #777;
        }

        .sub-value {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            margin-top: 2px;
        }

        .dust-circle-group {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .dust-card {
            text-align: center;
        }

        .circle-gauge {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid #4cd137;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .dust-name {
            font-size: 12px;
            color: #555;
        }

        .dust-status {
            font-size: 11px;
            color: #4cd137;
            font-weight: bold;
        }

        .forecast-section {
            max-width: 1200px;
            margin: 0 auto 20px;
            padding: 0 15px;
        }

        .forecast-card {
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .forecast-title {
            font-size: 17px;
            font-weight: bold;
            color: #222;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .forecast-table-wrapper {
            overflow-x: auto;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            min-width: 800px;
        }

        .forecast-table th, .forecast-table td {
            border: 1px solid #e2e8f0;
            padding: 8px 4px;
        }

        .forecast-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }

        .temp-min { color: #2563eb; font-weight: bold; }
        .temp-max { color: #e11d48; font-weight: bold; }

        .hourly-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            min-width: 900px;
        }

        .hourly-table td {
            border-bottom: 1px solid #eee;
            padding: 10px 4px;
        }

        .hourly-header-row {
            background-color: #f8fafc;
            font-weight: bold;
            color: #334155;
        }

        /* 💡 복구된 자바스크립트 실습 영역 */
        .bottom-section {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 15px;
        }

        .js-card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 20px;
        }

        .js-card {
            background-color: #f8f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 15px;
        }

        .js-card h4 {
            font-size: 15px;
            color: #0078d4;
            margin-bottom: 12px;
            border-bottom: 2px solid #0078d4;
            padding-bottom: 5px;
        }

        .js-card input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .js-card button {
            width: 100%;
            padding: 8px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }
            .js-card-grid {
                grid-template-columns: 1fr;
            }
            .gnb-menu {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-slogan">"하늘을 친구처럼, 국민을 하늘처럼"</div>
        <div class="header-main">
            <div class="logo-area">
                <div class="logo-mark">날</div>
                <div class="logo-text">
                    <h1>날씨누리</h1>
                    <span>날씨정보시스템</span>
                </div>
            </div>
            <ul class="gnb-menu">
                <li><a href="#">특보·예보</a></li>
                <li><a href="#">현재날씨</a></li>
                <li><a href="#">위험기상</a></li>
                <li><a href="#">수치일기도</a></li>
                <li><a href="#">기후·기후변화</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="left-panel">
            <div class="tab-buttons">
                <button class="tab-btn active">날씨</button>
                <button class="tab-btn">전국</button>
                <button class="tab-btn">태풍</button>
            </div>

            <div class="search-box">
                <input type="text" class="search-input" value="경기도 오산시 오산동" placeholder="주요지역명으로 입력">
                <button class="search-btn">검색</button>
            </div>

            <div class="filter-tags">
                <button class="tag-btn">초단기강수예측</button>
                <button class="tag-btn">특보</button>
                <button class="tag-btn">어제</button>
                <button class="tag-btn active">1시간관측</button>
                <button class="tag-btn">현재날씨</button>
                <button class="tag-btn">예보</button>
            </div>

            <div class="map-view-box">
                <img src="스크린샷 2026-10-29 115220.png" alt="오산시 기상 현황 지도" onerror="this.style.display='none'; document.getElementById('alt-text').style.display='block';">
                <div id="alt-text" style="display:none; text-align:center; color:#666;">
                    <h3>📍 경기도 오산시 기상 지도</h3>
                    <p style="font-size:13px; margin-top:5px;">[스크린샷 2026-10-29 115220.png] 이미지 파일 연결 영역</p>
