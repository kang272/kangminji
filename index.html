<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨누리 - 오산시 날씨정보시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: '맑은 고딕', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.5;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
        }

        .top-slogan {
            text-align: center;
            font-size: 12px;
            color: #1a5cbe;
            font-weight: bold;
            padding: 6px 0;
            background-color: #f1f5f9;
        }

        .header-main {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background-color: #1a5cbe;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 800;
            color: #222;
        }

        .logo-text span {
            font-size: 11px;
            color: #777;
            display: block;
        }

        .gnb-menu {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .gnb-menu a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        .gnb-menu a:hover {
            color: #0078d4;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 20px;
        }

        .left-panel {
            flex: 1.2;
            min-width: 0;
        }

        .tab-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            padding: 8px 24px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background-color: #70757a;
            color: white;
            border-radius: 4px 4px 0 0;
        }

        .tab-btn.active {
            background-color: #0078d4;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #0078d4;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 0 20px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-tags {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tag-btn {
            padding: 5px 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 3px;
            cursor: pointer;
            color: #444;
        }

        .tag-btn.active {
            background-color: #0078d4;
            color: white;
            border-color: #0078d4;
        }

        .map-view-box {
            width: 100%;
            height: 480px;
            background-color: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-view-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right-panel {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .location-header h3 {
            font-size: 16px;
            color: #333;
        }

        .update-time {
            font-size: 12px;
            color: #888;
        }

        .current-temp-area {
            text-align: center;
            padding: 15px 0 5px;
        }

        .main-degree {
            font-size: 52px;
            font-weight: 800;
            color: #111;
        }

        .sensory-temp {
            font-size: 14px;
            color: #555;
        }

        .temp-diff {
            font-size: 14px;
            color: #333;
            margin-top: 5px;
            font-weight: 600;
        }

        .weather-sub-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 12px 5px;
            text-align: center;
            margin: 10px 0;
        }

        .sub-item {
            border-right: 1px solid #eee;
        }

        .sub-item:last-child {
            border-right: none;
        }

        .sub-label {
            font-size: 12px;
            color: #777;
        }

        .sub-value {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            margin-top: 2px;
        }

        .dust-circle-group {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .dust-card {
            text-align: center;
        }

        .circle-gauge {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid #4cd137;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .dust-name {
            font-size: 12px;
            color: #555;
        }

        .dust-status {
            font-size: 11px;
            color: #4cd137;
            font-weight: bold;
        }

        .forecast-section {
            max-width: 1200px;
            margin: 0 auto 20px;
            padding: 0 15px;
        }
